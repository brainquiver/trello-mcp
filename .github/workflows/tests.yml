name: Tests

# The offline checks. They need no Trello account, so they run on every pull request, from a
# fork too, and on each push to main. A push to another branch waits for its pull request,
# because a branch in this repository with a pull request would otherwise run every check twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A change to documents alone skips the heavy jobs below. A unit test compares the tool list
  # under skills/ with the code, so a file there counts as code. Every other .md file and the
  # LICENSE count as documents. This job and the gate at the end are short, so they run on GitHub.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # Pinned to a commit, because a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The parent of the merge commit of a pull request is the tip of main, and so is the
          # parent of a squash merge on main. One diff then serves both events.
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=false
          if [ "$EVENT" != pull_request ] && [ "$EVENT" != push ]; then code=true; fi
          files=$(git diff --name-only HEAD^1 HEAD) || code=true
          [ -n "$files" ] || code=true
          while IFS= read -r file; do
            case "$file" in
              skills/*) code=true ;;
              *.md | LICENSE) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Changed files:"; echo "$files"; echo "Code changed: $code"

  unit:
    # GitHub adds the matrix value to this name, as Unit (22). A name that holds the matrix
    # expression shows that expression when the job is skipped.
    name: Unit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Blacksmith for pushes to main and for pull requests. A Dependabot pull request stays on
    # GitHub, because a routine update gains nothing from a faster runner. The test reads who
    # opened the pull request, so a manual re-run of its checks stays on GitHub too.
    runs-on: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The Node.js releases in long-term support. Node.js 20 reached its end of life in April 2026.
        node: [22, 24]
    steps:
      # Pinned to a commit, because a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit

  # The ruleset requires this job, and not the unit jobs. A workflow that a path filter skips
  # leaves its required checks waiting, and a skipped matrix job does not report the names of its
  # matrix. This job reports in both cases: it passes when the code changed and every unit job
  # passed, or when only documents changed and the unit jobs were skipped.
  gate:
    name: Tests
    needs: [changes, unit]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RESULT: ${{ needs.unit.result }}
        run: |
          echo "Changes: $CHANGES. Code changed: $CODE. unit: $RESULT."
          [ "$CHANGES" = success ]
          if [ "$CODE" = true ]; then [ "$RESULT" = success ]; else [ "$RESULT" = skipped ]; fi
